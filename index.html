<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <!--
      Layout viewport is pinned to the desktop content width (1360px + 40px
      gutters) so phones render the PC layout and scale it down to fit,
      instead of reflowing into a stacked mobile layout. Desktop browsers
      ignore this tag entirely, so the responsive rules in CSS still apply
      to a resized desktop window.

      Deliberately no `initial-scale` — that would override the auto
      shrink-to-fit and leave the page zoomed in. Deliberately no
      `maximum-scale` / `user-scalable=no` — pinch-zoom must stay available.
    -->
    <meta name="viewport" content="width=1440" />
